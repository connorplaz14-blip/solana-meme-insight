name: CTRL quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrl-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NITRO_PRESET: vercel

  wallet-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ctrl_test
          POSTGRES_USER: ctrl_test
          # Public, disposable CI credential; never a user/provider secret.
          POSTGRES_PASSWORD: ctrl_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ctrl_test -d ctrl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CTRL_TEST_DATABASE_URL: postgresql://ctrl_test:ctrl_ci_only@localhost:5432/ctrl_test
      CTRL_REQUIRE_POSTGRES: "1"
    defaults:
      run:
        working-directory: services/wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/wallet/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m compileall -q ctrl_wallet
